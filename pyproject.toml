[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bloom-iot"
version = "0.1.0"
description = "Listen & Adapt IoT Framework for plant and microgreen monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["iot", "mqtt", "sensors", "microgreens", "raspberry-pi", "arduino"]
dependencies = [
    "paho-mqtt>=2.0.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "PyYAML>=6.0",
    "aiocoap>=0.4.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
bloom-iot = "bloom_iot.runner:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["bloom_iot*"]
